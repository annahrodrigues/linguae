<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linguae</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#1D7A5F">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block">
</head>
<body>
<style>
/* Linguae 2.0 — tokens and components follow Linguae React UI Kit 2.0 and Brand Book 1.0.
   Layout: sidebar + content on desktop, bottom tab bar on phones, full-screen lesson shell. */
:root{
  /* Forest Green #248F70 is the brand reference; the UI green is deepened to #1D7A5F
     so white-on-green and green-on-white both clear WCAG AA (4.5:1). */
  --color-primary:#1D7A5F; --color-primary-dark:#17634E; --color-primary-light:#A8DDBB;
  --color-primary-ink:#1D7A5F; --color-primary-soft:#E5F1E8;
  --color-accent:#F2B85B; --color-accent-ink:#8A6730; --color-accent-soft:#FBEFD8;
  --color-coral:#F28B75; --color-coral-ink:#9F594A; --color-coral-soft:#FDEAE4;
  --color-cta:#253D36; --color-cta-ink:#FFFFFF;
  --color-background:#F8F7F0; --color-surface:#FFFFFF; --color-surface-soft:#F5EBCB;
  --color-raise:#F7F9F5;
  --color-text:#253D36; --color-text-muted:#616D67; --color-border:#E7E9E2;
  --tile-mint:#E4F4E9; --tile-gold:#FFF0D1; --tile-coral:#FFEBE6;
  --hero-from:#E8F4EA; --hero-to:#F9F1DA;
  --medal-from:#FFEDC2; --medal-to:#F2B85B; --medal-ring:#FFF6DF; --medal-ink:#684410;
  --font-heading:'Outfit','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --radius-card:16px; --radius-button:12px; --radius-input:10px;
  --shadow-soft:0 1px 2px rgba(37,61,54,.05),0 6px 18px rgba(37,61,54,.05);
  --shadow-lift:0 2px 4px rgba(37,61,54,.07),0 10px 26px rgba(37,61,54,.08);
  --t:180ms cubic-bezier(.2,.7,.3,1);
}
/* Dark is not the light theme with the lights off: the brand's warm cream and
   golden yellow carry the surfaces and the text, and green stays where it
   means something — the primary button, a right answer, progress. The two
   blocks below are the same palette twice, once for the system setting and
   once for data-theme="dark"; a test holds them to that and checks every pair
   of text and background against AA. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-primary:#1D7A5F; --color-primary-dark:#17634E; --color-primary-light:#A8DDBB;
  --color-primary-ink:#9FD9B4; --color-primary-soft:#2E3A2B;
  --color-accent:#F2B85B; --color-accent-ink:#F7C871; --color-accent-soft:#3A2F1A;
  --color-coral:#F28B75; --color-coral-ink:#F2A190; --color-coral-soft:#3B271F;
  --color-cta:#F2B85B; --color-cta-ink:#2A1D05;
  --color-background:#1C1813; --color-surface:#262117; --color-surface-soft:#332B1C;
  --color-raise:#2E2819;
  --color-text:#F6EFDE; --color-text-muted:#BFB198; --color-border:#3D3527;
  --tile-mint:#23362B; --tile-gold:#3C3119; --tile-coral:#3B271F;
  --hero-from:#243029; --hero-to:#3A2F1A;
  --medal-from:#6B4F16; --medal-to:#F2B85B; --medal-ring:#4A3A14; --medal-ink:#2A1D05;
  --shadow-soft:0 1px 2px rgba(0,0,0,.34),0 6px 18px rgba(0,0,0,.26);
  --shadow-lift:0 2px 6px rgba(0,0,0,.38),0 12px 28px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --color-primary:#1D7A5F; --color-primary-dark:#17634E; --color-primary-light:#A8DDBB;
  --color-primary-ink:#9FD9B4; --color-primary-soft:#2E3A2B;
  --color-accent:#F2B85B; --color-accent-ink:#F7C871; --color-accent-soft:#3A2F1A;
  --color-coral:#F28B75; --color-coral-ink:#F2A190; --color-coral-soft:#3B271F;
  --color-cta:#F2B85B; --color-cta-ink:#2A1D05;
  --color-background:#1C1813; --color-surface:#262117; --color-surface-soft:#332B1C;
  --color-raise:#2E2819;
  --color-text:#F6EFDE; --color-text-muted:#BFB198; --color-border:#3D3527;
  --tile-mint:#23362B; --tile-gold:#3C3119; --tile-coral:#3B271F;
  --hero-from:#243029; --hero-to:#3A2F1A;
  --medal-from:#6B4F16; --medal-to:#F2B85B; --medal-ring:#4A3A14; --medal-ink:#2A1D05;
  --shadow-soft:0 1px 2px rgba(0,0,0,.34),0 6px 18px rgba(0,0,0,.26);
  --shadow-lift:0 2px 6px rgba(0,0,0,.38),0 12px 28px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-background);color:var(--color-text);
  font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-heading);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-weight:700;font-size:30px;line-height:1.18}
h2{font-weight:700;font-size:25px;line-height:1.22}
h3{font-weight:600;font-size:18px}
p{margin:0}
img{max-width:100%}
button{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--color-surface);z-index:60}
#app{min-height:100%;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;font-size:22px;vertical-align:-5px}
.ms--sm{font-size:18px;vertical-align:-4px}
.ms--lg{font-size:28px;vertical-align:-7px}
.eyebrow{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--color-text-muted)}
.muted{color:var(--color-text-muted)}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px;border-radius:6px}

/* ---------- buttons (UI Kit: radius 12, 44px target, lift on hover) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  border:1px solid transparent;border-radius:var(--radius-button);padding:13px 20px;
  font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;
  background:var(--color-primary-soft);color:var(--color-primary-ink);
  transition:transform var(--t),background var(--t),box-shadow var(--t)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn--primary{background:var(--color-primary);color:#fff}
.btn--primary:hover:not(:disabled){background:var(--color-primary-dark)}
.btn--dark{background:var(--color-cta);color:var(--color-cta-ink)}
.btn--outline{background:transparent;border-color:var(--color-primary-ink);color:var(--color-primary-ink)}
.btn--quiet{background:transparent;border-color:var(--color-border);color:var(--color-text-muted)}
.btn--coral{background:var(--color-coral);color:#2A1710}
.btn--full{width:100%}
.btn--sm{min-height:0;padding:9px 14px;font-size:14px;border-radius:10px}
.btn:disabled{cursor:not-allowed;background:var(--color-border);color:var(--color-text-muted);opacity:.75}

/* ---------- surfaces ---------- */
.card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-soft)}
.card--soft{background:var(--color-surface-soft);border-color:transparent;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--color-surface);
  border:1px solid var(--color-border);border-radius:100px;padding:8px 13px;
  font-size:13px;font-weight:600;cursor:default}
button.pill{cursor:pointer;transition:border-color var(--t)}
button.pill:hover{border-color:var(--color-primary-ink)}
.code{width:26px;height:26px;border-radius:8px;flex:none;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(37,61,54,.18)}
.code svg{display:block;width:100%;height:100%}

/* ---------- shell: sidebar on desktop, tab bar on phones ---------- */
.shell{display:flex;min-height:100%;flex:1}
.sidebar{width:244px;flex:none;background:var(--color-surface);border-right:1px solid var(--color-border);
  padding:24px 16px;display:flex;flex-direction:column;position:sticky;
  top:env(safe-area-inset-top,0px);height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;margin:2px 4px 32px}
.logo{display:inline-flex;align-items:center;gap:9px;max-width:100%;line-height:1;color:var(--color-text)}
.logo img{width:50px;height:50px;object-fit:contain;flex:none}
.logo__type{display:flex;flex-direction:column;min-width:0}
.logo__type strong{font-family:var(--font-heading);font-weight:700;font-size:24px;letter-spacing:-.03em}
.logo__type small{font-family:var(--font-body);font-weight:700;font-size:7.5px;letter-spacing:.14em;
  margin-top:5px;white-space:nowrap;color:var(--color-text-muted)}
.logo--compact img{width:36px;height:36px}
.logo--compact .logo__type strong{font-size:20px}
.logo--lg{flex-direction:column;gap:10px}
.logo--lg img{width:116px;height:116px}
.logo--lg .logo__type{align-items:center}
.logo--lg .logo__type strong{font-size:36px}
.logo--lg .logo__type small{font-size:11px;letter-spacing:.2em;margin-top:7px}
.nav-label{margin:0 12px 12px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;
  padding:12px 14px;border-radius:11px;color:var(--color-text-muted);font-weight:600;font-size:14.5px;
  cursor:pointer;margin-bottom:6px;transition:background var(--t),color var(--t)}
.nav-item:hover,.nav-item.active{background:var(--color-primary-soft);color:var(--color-primary-ink)}
.side-card{background:var(--color-primary-soft);border-radius:18px;padding:16px;margin-top:auto;
  text-align:center}
.side-card img{width:104px;height:auto}
.side-card strong{display:block;font-family:var(--font-heading);font-size:15px;margin-top:4px}
.side-card p{font-size:12.5px;color:var(--color-text-muted);margin-top:2px}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;
  min-height:68px;padding-block:10px;background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.mobile-brand{display:none;align-items:center}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.page{display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.page-head p{color:var(--color-text-muted);margin-top:6px;font-size:15px}
.tabbar{display:none}
.appfoot{text-align:center;color:var(--color-text-muted);font-size:12px;padding:18px 0 28px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;
  gap:18px;background:linear-gradient(110deg,var(--hero-from),var(--hero-to));
  border-radius:23px;padding:30px 34px;min-height:236px}
.hero__txt{z-index:1;max-width:460px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.hero h2{font-size:28px}
.hero p{color:var(--color-text);opacity:.82;font-size:15px}
.hero .eyebrow{color:var(--color-primary-ink)}
.hero img{align-self:flex-end;width:238px;margin-bottom:-30px;flex:none}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:16px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-icon{display:grid;place-items:center;border-radius:12px;width:38px;height:38px;margin-bottom:12px}
.stat-icon.mint{background:var(--tile-mint);color:var(--color-primary-ink)}
.stat-icon.gold{background:var(--tile-gold);color:var(--color-accent-ink)}
.stat-icon.coral{background:var(--tile-coral);color:var(--color-coral-ink)}
.stat .label{font-size:12.5px;font-weight:600;color:var(--color-text-muted)}
.stat strong{font-family:var(--font-heading);font-weight:700;font-size:27px;line-height:1.2;margin:4px 0}
.stat p{font-size:12.5px;color:var(--color-text-muted)}
.progress{height:9px;background:var(--color-border);border-radius:100px;overflow:hidden;margin:10px 0 2px}
.progress span{display:block;height:100%;border-radius:100px;background:var(--color-primary-ink);
  transition:width 250ms cubic-bezier(.2,.7,.3,1)}

/* ---------- dashboard grid ---------- */
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.lesson-inner{display:flex;align-items:center;gap:14px;padding:16px;background:var(--color-raise);
  border-radius:14px}
.lesson-inner>div:nth-child(2){flex:1;min-width:0}
.lesson-inner p{font-size:12.5px;color:var(--color-text-muted)}
.circle-btn{border:0;background:var(--color-primary);color:#fff;width:38px;height:38px;border-radius:50%;
  cursor:pointer;display:grid;place-items:center;flex:none;transition:transform var(--t)}
.circle-btn:hover{transform:translateY(-2px)}
.minipath{display:flex;align-items:center;justify-content:center;padding:18px 0 10px}
.path-step{border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none;
  background:var(--color-border);color:var(--color-text-muted);font-weight:700;font-size:14px}
.path-step.done{background:var(--color-primary);color:#fff}
.path-step.current{background:var(--color-surface-soft);color:var(--color-text);
  border:2px solid var(--color-accent)}
.path-line{height:3px;background:var(--color-border);flex:1;max-width:58px}
.mini-card{display:flex;align-items:center;gap:13px;background:var(--tile-mint);padding:14px;
  border-radius:12px}
.mini-card.attention{background:var(--tile-coral)}
.mini-card p{font-size:12.5px;color:var(--color-text-muted)}
.small-note{text-align:center;font-size:12.5px;color:var(--color-text-muted)}

/* ---------- learning trail ---------- */
.unit{display:flex;flex-direction:column;gap:12px}
.unit__hd{display:flex;align-items:center;gap:12px;border-radius:var(--radius-card);padding:14px 16px;
  color:#fff;background:var(--color-primary)}
.unit__hd small{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.unit__hd h3{font-size:18px}
.note{background:var(--color-surface-soft);border-radius:var(--radius-card);padding:12px 14px;font-size:14px}
.note em{display:block;font-style:normal;font-family:var(--font-heading);font-weight:600;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:3px}
.trail{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 4px}
.trail::before{content:"";position:absolute;top:16px;bottom:16px;left:50%;width:0;
  border-left:2px dashed var(--color-border);transform:translateX(-1px)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  transform:translateX(calc(var(--k) * clamp(0px,7vw,54px)))}
.node__btn{width:64px;height:64px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-muted);
  box-shadow:var(--shadow-soft);transition:transform var(--t),box-shadow var(--t)}
.node__btn .ms{font-size:27px}
.node__btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.node__btn.started{background:var(--color-primary-light);border-color:transparent;color:#253D36}
.node__btn.now{background:var(--color-surface-soft);border:2px solid var(--color-accent);color:var(--color-text)}
.node__btn.done{background:var(--color-primary);border-color:transparent;color:#fff}
.node__btn:disabled{cursor:not-allowed;background:var(--color-surface);color:var(--color-border)}
.node__lbl{font-family:var(--font-heading);font-weight:600;font-size:14px;text-align:center;max-width:180px}
.node__lbl span{display:block;font-family:var(--font-body);font-weight:500;font-size:11.5px;
  color:var(--color-text-muted)}
.crowns{display:flex;gap:2px;height:14px;align-items:center}
.crowns .ms{font-size:13px;color:var(--color-accent-ink)}
.crowns .ms.off{color:var(--color-border)}

/* ---------- achievements ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:16px}
.badge{text-align:center}
.medal{margin:2px auto 14px;width:76px;height:76px;display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(140deg,var(--medal-from),var(--medal-to));
  border:5px solid var(--medal-ring);color:var(--medal-ink)}
.medal .ms{font-size:32px}
.badge h3{font-size:16px;margin-bottom:5px}
.badge p{font-size:12.5px;color:var(--color-text-muted);min-height:38px}
.badge .state{display:block;font-size:11.5px;font-weight:700;color:var(--color-primary-ink);margin-top:8px}
.badge.locked .medal{background:var(--color-border);border-color:var(--color-surface);
  color:var(--color-text-muted)}
.badge.locked .state{color:var(--color-text-muted)}

/* ---------- practice ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column}
.pcard h3{font-size:17px;margin:13px 0 5px}
.pcard p{font-size:13px;color:var(--color-text-muted);flex:1;margin-bottom:15px}
.tally{font-family:var(--font-heading);font-weight:700;font-size:13px;line-height:1;
  padding:7px 11px;border-radius:100px;background:var(--tile-mint);color:var(--color-primary-ink)}
.tally--miss{background:var(--tile-coral);color:var(--color-coral-ink)}
.tally--none{background:var(--color-border);color:var(--color-text-muted)}

/* ---------- progress & vocabulary ---------- */
.tabs{display:flex;gap:6px;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:12px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 16px;font-weight:600;
  font-size:14px;color:var(--color-text-muted);cursor:pointer;transition:background var(--t),color var(--t)}
.tabs button[aria-selected="true"]{background:var(--color-primary-soft);color:var(--color-primary-ink)}
.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.vocab__row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--color-border);padding-bottom:10px}
.vocab__row:last-child{border-bottom:0;padding-bottom:0}
.vocab__row strong{display:block;font-family:var(--font-heading);font-weight:600;font-size:16px}
.vocab__row span{font-size:13px;color:var(--color-text-muted)}
.meter{display:flex;gap:3px;flex:none}
.meter i{width:12px;height:6px;border-radius:3px;background:var(--color-border)}
.meter i.on{background:var(--color-primary-ink)}

/* ---------- lesson shell ---------- */
.lesson-mode,.lesson-mode body{overflow:hidden}
.lesson-mode #app{height:100%;overflow-y:auto}
.lsn{flex:1;display:flex;flex-direction:column;min-height:0}
.wrap{width:100%;max-width:640px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lsn__top{display:flex;align-items:center;gap:14px;padding-block:14px}
.iconbtn{border:1px solid var(--color-border);background:var(--color-surface);border-radius:10px;
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--color-text-muted);
  flex:none;transition:color var(--t),border-color var(--t)}
.iconbtn:hover{color:var(--color-primary-ink);border-color:var(--color-primary-ink)}
.lsn__top .progress{flex:1;margin:0}
.lives{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;

const LANGS = Object.keys(COURSES);
const DAILY_GOAL = 30;
const BOX_DAYS = [0, 1, 3, 7, 16, 35];

LANGS.forEach(function(lg){
  const c = COURSES[lg];
  c.id = lg;
  c.units = UNIT_META.map(function(u, ui){
    return {
      id: u.id, title: u.title, caption: u.caption, tint: u.tint, deep: u.deep,
      tip: c.tips[ui],
      lessons: u.lessons.map(function(name, li){
        const n = ui * 2 + li;
        const kind = n % 2 === 0 ? "w" : "p";
        return {
          id: lg + "-" + n, title: name, kind: kind, unit: u.id, tint: u.tint, deep: u.deep,
          items: c.sets[n].map(function(row, ri){
            return { id: lg + "-" + n + "-" + ri, en: row[0], tgt: row[1], rom: row[2] || "", bank: row[3] || null, kind: kind, lesson: lg + "-" + n };
          })
        };
      })
    };
  });
  c.lessons = c.units.reduce(function(a, u){ return a.concat(u.lessons); }, []);
  c.items = c.lessons.reduce(function(a, l){ return a.concat(l.items); }, []);
  c.byId = {};
  c.items.forEach(function(it){ c.byId[it.id] = it; });
});

const KEY = "lingua-trail-v1";
let S = load();

function freshCourse(){ return { xp:0, crowns:{}, srs:{} }; }
function load(){
  const base = { active:null, streak:0, lastDay:null, todayXp:0, today:null, courses:{} };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === "object") Object.assign(base, p);
    }
  } catch (e) { /* storage unavailable — run in memory */ }
  LANGS.forEach(function(lg){
    if (!base.courses[lg]) base.courses[lg] = freshCourse();
    const c = base.courses[lg];
    if (typeof c.xp !== "number") c.xp = 0;
    if (!c.crowns) c.crowns = {};
    if (!c.srs) c.srs = {};
  });
  if (base.active && LANGS.indexOf(base.active) === -1) base.active = null;
  if (base.today !== today()) { base.today = today(); base.todayXp = 0; }
  return base;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dayDiff(a, b){
  if (!a || !b) return null;
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}
function course(){ return COURSES[S.active]; }
function prog(){ return S.courses[S.active]; }
function crownsOf(id){ return prog().crowns[id] || 0; }
function unlocked(lessonId){
  const list = course().lessons;
  const i = list.findIndex(function(l){ return l.id === lessonId; });
  if (i <= 0) return true;
  return crownsOf(list[i-1].id) > 0;
}
function srsOf(itemId){ return prog().srs[itemId] || { box:0, due:0, seen:0, wrong:0 }; }
function dueItems(){
  const now = Date.now(), p = prog(), out = [];
  course().items.forEach(function(it){
    const r = p.srs[it.id];
    if (r && r.seen > 0 && r.due <= now) out.push(it);
  });
  return out;
}
function gradeItem(itemId, ok){
  const p = prog(), r = srsOf(itemId);
  const box = ok ? Math.min(5, r.box + 1) : Math.max(0, r.box - 2);
  const days = ok ? BOX_DAYS[box] : 0;
  p.srs[itemId] = {
    box: box,
    due: Date.now() + (days ? days * 86400000 : 10 * 60000),
    seen: r.seen + 1,
    wrong: r.wrong + (ok ? 0 : 1)
  };
}
function addXp(n){
  prog().xp += n;
  if (S.today !== today()) { S.today = today(); S.todayXp = 0; }
  S.todayXp += n;
}
function touchStreak(){
  const t = today();
  const d = dayDiff(S.lastDay, t);
  if (d === null) S.streak = 1;
  else if (d === 1) S.streak = S.streak + 1;
  else if (d > 1) S.streak = 1;
  else if (S.streak === 0) S.streak = 1;
  S.lastDay = t;
}

const app = document.getElementById("app");
const esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]; }); };
function shuffle(a){ const r = a.slice(); for (let i = r.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
function sample(arr, n, skip){
  const pool = arr.filter(function(x){ return !skip || skip.indexOf(x) === -1; });
  return shuffle(pool).slice(0, n);
}
function norm(s){
  return String(s).toLowerCase()
    .replace(/[‘’ʼ]/g, "'")
    .replace(/ß/g, "ss")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^\p{L}\p{N}' ]/gu, " ")
    .replace(/\s+/g, " ").trim();
}
function loose(s){ return norm(s).replace(/'/g, "").replace(/\s+/g, ""); }
function lev(a, b){
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({length:n+1}, function(_, i){ return i; });
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function words(s){
  return String(s).split(/\s+/)
    .map(function(w){ return w.replace(/^[^\p{L}\p{N}']+|[^\p{L}\p{N}']+$/gu, ""); })
    .filter(Boolean);
}

/* ---- speech ---- */
let voices = [];
const canSpeak = typeof window !== "undefined" && "speechSynthesis" in window;
function refreshVoices(){ try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if (canSpeak) {
  refreshVoices();
  try { window.speechSynthesis.onvoiceschanged = refreshVoices; } catch (e) {}
}
/* Several voices can answer for one language and they are not equal. Windows
   ships legacy SAPI voices beside the newer neural ones, and Chrome adds its
   own on top; getVoices returns them in install order, so taking the first
   match lands on the worst one as often as not. Score them instead. */
function voiceScore(v, lang){
  const want = lang.replace("_", "-").toLowerCase();
  const tag = (v.lang || "").replace("_", "-").toLowerCase();
  if (tag.slice(0, 2) !== want.slice(0, 2)) return -1;
  let score = tag === want ? 40 : 10;               /* fr-FR beats fr-CA */
  const name = (v.name || "").toLowerCase();
  if (name.indexOf("natural") > -1) score += 30;    /* Microsoft's neural voices */
  if (name.indexOf("online") > -1) score += 10;
  if (name.indexOf("google") > -1) score += 25;     /* Chrome's, far better than SAPI */
  if (v.localService === false) score += 8;         /* network voices are the newer ones */
  if (v.default) score += 2;
  return score;
}

function voiceFor(lang){
  if (!canSpeak) return null;
  if (!voices.length) refreshVoices();
  let best = null, bestScore = 0;
  voices.forEach(function(v){
    const n = voiceScore(v, lang);
    if (n > bestScore) { best = v; bestScore = n; }
  });
  return best;
}

function speak(text, lang){
  const v = voiceFor(lang);
  /* With no voice for this language the engine falls back to the system
     default, which reads French with a Portuguese mouth. Silence is better. */
  if (!canSpeak || !text || !v) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v;
    u.lang = v.lang || lang;
    u.rate = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function hasVoiceFor(lang){ return !!voiceFor(lang); }

/* ---- the two chimes ----
   Played when an answer is checked, and made here out of oscillators rather
   than loaded as files: a few lines weigh nothing, and nothing is sampled from
   anyone. Right is a quick rise, two notes a fifth apart with a soft bell on
   top; wrong is a short low fall, filtered so it thuds rather than rasps.
   The audio context is created on the first check, which is a user gesture, so
   browsers let it start. */
let sfx = null;
function sfxCtx(){
  if (sfx !== null) return sfx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    sfx = Ctx ? new Ctx() : false;
  } catch (e) { sfx = false; }
  return sfx;
}

function blip(ctx, at, opts){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  let node = gain;
  if (opts.cutoff) {
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = opts.cutoff;
    gain.connect(lp);
    node = lp;
  }
  osc.type = opts.type || "sine";
  osc.frequency.setValueAtTime(opts.from, at);
  if (opts.to) osc.frequency.exponentialRampToValueAtTime(opts.to, at + opts.dur);
  /* A few milliseconds of attack, then an exponential tail: a hard start
     clicks, and an exponential ramp cannot reach zero, so it ends on stop. */
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(opts.peak, at + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + opts.dur);
  osc.connect(gain);
  node.connect(ctx.destination);
  osc.start(at);
  osc.stop(at + opts.dur + 0.02);
}

/* The recordings in assets/sfx, built from sounds/ by tools/sfx.py. They are
   Ogg/Opus: unlike MP3 it carries a pre-skip the decoder honours, so a sound
   that answers a click starts on the click. Where a browser cannot play them,
   the oscillators below take over for the two that have an equivalent. */
const sfxEls = {};
function sfxEl(name){
  if (name in sfxEls) return sfxEls[name];
  let el = null;
  try {
    el = new Audio("assets/sfx/" + name + ".opus");
    el.preload = "auto";
  } catch (e) { el = null; }
  sfxEls[name] = el;
  return el;
}

/* Fetching starts when the element is made, so a lesson warms them up rather
   than meeting the first one cold. */
function warmSfx(){
  ["correct_answer", "incorrect_answer", "finished_correct", "finished_mid", "finished_incorrect"]
    .forEach(sfxEl);
}

function playSfx(name, instead){
  const el = sfxEl(name);
  if (!el) { if (instead) instead(); return; }
  let fallen = false;
  const fail = function(){
    if (fallen) return;
    fallen = true;
    if (instead) instead();
  };
  try {
    el.onerror = fail;
    el.currentTime = 0;
    const playing = el.play();
    if (playing && playing.catch) playing.catch(fail);
  } catch (e) { fail(); }
}

/* Right and wrong, as recordings, falling back to the oscillators. */
function sayRight(){ playSfx("correct_answer", function(){ chime(true); }); }
function sayWrong(){ playSfx("incorrect_answer", function(){ chime(false); }); }

function chime(ok){
  const ctx = sfxCtx();
  if (!ctx) return;
  try {
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime + 0.01;
    if (ok) {
      blip(ctx, t,         { from: 784,  dur: 0.11, peak: 0.16, type: "triangle" });
      blip(ctx, t + 0.085, { from: 1175, dur: 0.20, peak: 0.15, type: "triangle" });
      blip(ctx, t + 0.085, { from: 2349, dur: 0.16, peak: 0.04, type: "sine" });
    } else {
      blip(ctx, t, { from: 196, to: 131, dur: 0.24, peak: 0.19, type: "sawtooth", cutoff: 760 });
      blip(ctx, t, { from: 98,  to: 65,  dur: 0.26, peak: 0.12, type: "sine" });
    }
  } catch (e) { /* audio is a flourish; never let it break a lesson */ }
}

/* ---- recorded audio ----
   A clip committed to the repository beats the system voice: it sounds the
   same for everyone and does not depend on what each machine happens to have
   installed, which is the whole problem with speech synthesis for a language
   course. assets/audio/index.json lists the clips that exist; with no manifest
   the app falls back to the voice, so this costs nothing until a file lands. */
const AUDIO = { format: "mp3", have: {}, byLang: {} };
let clipEl = null;

function loadClips(){
  if (typeof fetch !== "function") return;
  fetch("assets/audio/index.json", { cache: "no-cache" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(m){
      if (!m || !Array.isArray(m.items)) return;
      if (m.format) AUDIO.format = String(m.format).replace(/[^a-z0-9]/gi, "");
      m.items.forEach(function(id){
        AUDIO.have[id] = true;
        const lg = String(id).split("-")[0];
        AUDIO.byLang[lg] = (AUDIO.byLang[lg] || 0) + 1;
      });
      /* Clips can switch listening exercises on, so the trail is redrawn. */
      if (!sess && S.active) render();
    })
    .catch(function(){});
}

function clipFor(item){
  if (!item || !item.id || !AUDIO.have[item.id]) return null;
  return "assets/audio/" + String(item.id).split("-")[0] + "/" + item.id + "." + AUDIO.format;
}

function playClip(url, onFail){
  try {
    if (canSpeak) window.speechSynthesis.cancel();
    if (!clipEl) clipEl = new Audio();
    clipEl.onerror = onFail || null;
    clipEl.pause();
    clipEl.src = url;
    clipEl.currentTime = 0;
    const p = clipEl.play();
    if (p && p.catch) p.catch(onFail || function(){});
    return true;
  } catch (e) { return false; }
}

/* Read an item aloud: its own clip when there is one, the voice otherwise.
   A clip that is listed but will not load — a manifest ahead of the files, a
   connection that dropped — falls back to the voice rather than to silence. */
function sayItem(item, lang){
  if (!item) return;
  const url = clipFor(item);
  if (url) {
    let fallen = false;
    const toVoice = function(){
      if (fallen) return;
      fallen = true;
      speak(item.tgt, lang);
    };
    if (playClip(url, toVoice)) return;
  }
  speak(item.tgt, lang);
}

/* One item, by either route. */
function canHear(item, lang){ return !!clipFor(item) || hasVoiceFor(lang); }
/* A whole course, for the note on the trail. */
function courseHasAudio(c){ return hasVoiceFor(c.tts) || (AUDIO.byLang[c.id] || 0) > 0; }

/* ============================== EXERCISE BUILDER ============================== */

function pickKind(item, level, audioOk){
  const bag = [];
  const bankable = item.kind === "p" && (item.bank || words(item.tgt).length >= 3);
  bag.push("pick_tgt", "pick_tgt");
  bag.push("pick_en");
  if (bankable) bag.push("bank", "bank", "bank");
  if (level >= 1) bag.push("write");
  if (level >= 2 && bankable) bag.push("bank");
  if (audioOk) bag.push("listen");
  if (level >= 2) bag.push("write");
  return bag[Math.floor(Math.random() * bag.length)];
}

function makeExercise(item, level, c, audioOk, forced){
  const kind = forced || pickKind(item, level, audioOk);
  const pool = c.items.filter(function(x){ return x.kind === item.kind && x.id !== item.id; });
  const base = { id: item.id, item: item, kind: kind };

  if (kind === "pick_tgt" || kind === "listen") {
    const wrong = sample(pool, 3);
    return Object.assign(base, { options: shuffle([item].concat(wrong)), answer: item.id });
  }
  if (kind === "pick_en") {
    const wrong = sample(pool, 3);
    return Object.assign(base, { options: shuffle([item].concat(wrong)), answer: item.id });
  }
  if (kind === "bank") {
    const parts = item.bank ? item.bank.slice() : words(item.tgt);
    const extraPool = [];
    pool.forEach(function(x){ (x.bank ? x.bank : words(x.tgt)).forEach(function(w){ extraPool.push(w); }); });
    const extras = sample(extraPool.filter(function(w){ return parts.indexOf(w) === -1; }), Math.min(3, Math.max(2, Math.round(parts.length / 2))));
    return Object.assign(base, { parts: parts, tiles: shuffle(parts.concat(extras)) });
  }
  return base; /* write */
}

function buildLesson(lesson, c, level){
  const items = shuffle(lesson.items);
  const queue = [];
  if (lesson.kind === "w" && items.length >= 5) {
    queue.push({ kind: "match", id: lesson.id + "-match", pairs: sample(items, 5) });
  }
  items.slice(0, 10).forEach(function(it){
    queue.push(makeExercise(it, level, c, canHear(it, c.tts)));
  });
  return queue;
}

/* Three ways to practise, each a different pool drawn from the same progress.
   A lesson teaches a word; these bring it back. None of them is locked behind
   anything: what fills them is what you have already met. */
const PRACTICE_SETS = [
  { id: "due", title: "Today's review", icon: "exercise" },
  { id: "listen", title: "Listening drill", icon: "headphones" },
  { id: "mistakes", title: "Your mistakes", icon: "autorenew" }
];
const PRACTICE_SIZE = 10;

function practiceItems(mode, c){
  const p = prog();
  if (mode === "listen") {
    /* Only what can actually be played, and only what has been met: a drill is
       no place to meet a word for the first time. */
    return c.items.filter(function(it){
      return srsOf(it.id).seen > 0 && canHear(it, c.tts);
    });
  }
  if (mode === "mistakes") {
    return c.items.filter(function(it){ return srsOf(it.id).wrong > 0; })
      .sort(function(a, b){ return srsOf(b.id).wrong - srsOf(a.id).wrong; });
  }
  /* Today's review: what the schedule has called for, then the shakiest of the
     rest to fill the session up. */
  const due = dueItems();
  const weak = c.items.filter(function(it){
    const r = p.srs[it.id];
    return r && r.seen > 0 && due.indexOf(it) === -1;
  }).sort(function(a, b){ return srsOf(a.id).box - srsOf(b.id).box; });
  return due.concat(weak);
}

function buildPractice(c, mode){
  const m = mode || "due";
  const picked = practiceItems(m, c).slice(0, PRACTICE_SIZE);
  return shuffle(picked).map(function(it){
    /* The listening drill is the one set that fixes the shape of the question;
       the others take whatever the item is ready for. */
    return m === "listen" ? makeExercise(it, 2, c, true, "listen")
                          : makeExercise(it, 2, c, canHear(it, c.tts));
  });
}

/* ============================== SESSION ============================== */

let sess = null;

function startLesson(lesson){
  const c = course();
  const level = crownsOf(lesson.id);
  sess = {
    mode: "lesson", lesson: lesson, queue: buildLesson(lesson, c, level), idx: 0,
    hearts: 5, mistakes: 0, correct: 0, answered: 0, level: level, tipShown: false,
    sel: null, used: [], picked: null, matched: [], state: "ask", lastOk: null
  };
  document.documentElement.classList.add("lesson-mode");
  warmSfx();
  render();
}
/* `mode` also arrives as a click event from the older Review buttons, which
   is why it is checked rather than trusted. */
function startPractice(mode){
  const c = course();
  const set = PRACTICE_SETS.filter(function(s){ return s.id === mode; })[0] || PRACTICE_SETS[0];
  const q = buildPractice(c, set.id);
  if (!q.length) return;
  sess = {
    mode: "practice", set: set.id,
    lesson: { title: set.title, id: "practice", tint: "#248F70", deep: "#1C7058", unit: null },
    queue: q, idx: 0, hearts: Infinity, mistakes: 0, correct: 0, answered: 0, level: 2, tipShown: true,
    sel: null, used: [], picked: null, matched: [], state: "ask", lastOk: null
  };
  document.documentElement.classList.add("lesson-mode");
  warmSfx();
  render();
}
function quitLesson(){
  sess = null;
  document.documentElement.classList.remove("lesson-mode");
  window.scrollTo(0, 0);
  render();
}

function currentEx(){ return sess.queue[sess.idx]; }

function submit(){
  const ex = currentEx();
  let ok = false, given = "";
  if (ex.kind === "pick_tgt" || ex.kind === "pick_en" || ex.kind === "listen") {
    ok = sess.sel === ex.answer;
  } else if (ex.kind === "bank") {
    given = sess.used.join(" ");
    ok = loose(given) === loose(ex.parts.join(" "));
  } else if (ex.kind === "write") {
    given = (document.getElementById("answer") || {}).value || "";
    const target = norm(ex.item.tgt);
    const g = norm(given);
    const alts = [target, loose(ex.item.tgt)];
    if (ex.item.rom) alts.push(norm(ex.item.rom), loose(ex.item.rom));
    ok = alts.indexOf(g) > -1 || alts.indexOf(loose(given)) > -1;
    if (!ok && g.length > 3) {
      ok = alts.some(function(a){ return lev(g, a) <= (a.length > 14 ? 2 : 1); });
      if (ok) sess.typo = true;
    }
    sess.given = given;
  }
  sess.answered++;
  if (ok) sess.correct++;
  else { sess.mistakes++; if (sess.hearts !== Infinity) sess.hearts--; }
  if (ex.item) gradeItem(ex.item.id, ok);
  /* a missed item comes back at the end of the session, in an easier shape */
  if (!ok && ex.item) {
    const retry = makeExercise(ex.item, 0, course(), canHear(ex.item, course().tts));
    retry.retry = true;
    sess.queue.push(retry);
  }
  sess.lastOk = ok;
  sess.state = "feedback";
  if (ok) sayRight(); else sayWrong();
  save();
  /* Checking an answer plays the sound and nothing else. It used to read the
     word out again as well, which on a question that had just been listened to
     was the same word twice; the speaker beside the word is there for that. */
  render();
  if (sess.hearts <= 0) { sess.state = "dead"; render(); }
}

function advance(){
  sess.idx++;
  sess.sel = null; sess.used = []; sess.picked = null; sess.typo = false; sess.given = "";
  sess.matched = []; sess.spoke = false;
  if (sess.idx >= sess.queue.length) return finish();
  sess.state = "ask";
  render();
}

/* Three endings, not two. A lesson with a slip or two used to close on the
   same sound as one that went badly, which reads as a harsher verdict than
   the lesson deserved. Up to MISTAKES_FORGIVEN misses get the middle one. */
const MISTAKES_FORGIVEN = 3;
function endingFor(mistakes){
  if (!mistakes) return "finished_correct";
  return mistakes <= MISTAKES_FORGIVEN ? "finished_mid" : "finished_incorrect";
}

function finish(){
  const perfect = sess.mistakes === 0;
  playSfx(endingFor(sess.mistakes));
  const gained = sess.mode === "practice" ? 8 : (10 + (perfect ? 5 : 0));
  addXp(gained);
  touchStreak();
  if (sess.mode === "lesson") {
    const cur = crownsOf(sess.lesson.id);
    prog().crowns[sess.lesson.id] = Math.min(5, cur + 1);
  }
  sess.state = "done";
  sess.gained = gained;
  save();
  render();
}

let page = "learn";        /* learn | practice | achievements | progress */
let statTab = "progress";  /* progress | vocab */

function render(){
  if (!S.active) { app.innerHTML = viewPicker(); wirePicker(); return; }
  if (sess) {
    if (sess.state === "done") { app.innerHTML = viewDone(); wireDone(); return; }
    if (sess.state === "dead") { app.innerHTML = viewDead(); wireDead(); return; }
    app.innerHTML = viewLesson();
    wireLesson();
    return;
  }
  app.innerHTML = shell();
  wireShell();
}

/* ---------- helpers shared by the pages ---------- */
function nextLesson(){
  const c = course();
  return c.lessons.find(function(l){ return crownsOf(l.id) === 0 && unlocked(l.id); })
      || c.lessons.find(function(l){ return crownsOf(l.id) < 5; })
      || c.lessons[0];
}
function overallPct(){
  const c = course();
  const got = c.lessons.reduce(function(a, l){ return a + crownsOf(l.id); }, 0);
  return Math.round(got / (c.lessons.length * 5) * 100);
}
function unitOf(lesson){
  return course().units.find(function(u){ return u.id === lesson.unit; });
}
function progressBar(pct, label){
  return '<div class="progress" role="progressbar" aria-label="' + esc(label) + '" aria-valuenow="' + pct
    + '" aria-valuemin="0" aria-valuemax="100"><span style="width:' + pct + '%"></span></div>';
}

          ? '<p class="muted" style="font-size:14px;margin-bottom:14px">' + met.length + ' of ' + c.items.length
            + ' met so far, weakest first. Five bars means the word is due a long way out.</p>' + rows
          : '<div class="center">' + mascotImg("curious", 150)
            + '<p>Nothing here yet. Finish a lesson and your words start collecting.</p></div>')
      + '</article>';
  } else {
    const units = c.units.map(function(u){
      const got = u.lessons.reduce(function(a, l){ return a + crownsOf(l.id); }, 0);
      const max = u.lessons.length * 5;
      return '<li><span style="flex:1;min-width:0">' + esc(u.title) + '</span>'
        + '<span style="width:120px;flex:none">' + progressBar(Math.round(got / max * 100), u.title) + '</span>'
        + '<b class="num" style="width:46px;text-align:right">' + got + '/' + max + '</b></li>';
    }).join("");
    body = '<section class="stats">'
      + '<article class="card stat"><div class="stat-icon mint">' + ic("bolt") + '</div>'
      + '<div class="label">Total XP</div><strong class="num">' + p.xp + '</strong></article>'
      + '<article class="card stat"><div class="stat-icon gold">' + ic("local_fire_department") + '</div>'
      + '<div class="label">Day streak</div><strong class="num">' + S.streak + '</strong></article>'
      + '<article class="card stat"><div class="stat-icon mint">' + ic("menu_book") + '</div>'
      + '<div class="label">Words learned</div><strong class="num">' + learnedCount() + '</strong></article>'
      + '<article class="card stat"><div class="stat-icon coral">' + ic("exercise") + '</div>'
      + '<div class="label">Due for review</div><strong class="num">' + due + '</strong></article>'
      + '<article class="card stat"><div class="stat-icon gold">' + ic("star") + '</div>'
      + '<div class="label">Crowns</div><strong class="num">' + crowns + '</strong></article>'
      + '<article class="card stat"><div class="stat-icon mint">' + ic("school") + '</div>'
      + '<div class="label">Items met</div><strong class="num">' + met.length + '<small style="font-size:15px;color:var(--color-text-muted)">/'
      + c.items.length + '</small></strong></article>'
      + '</section>'
      + '<article class="card"><h3 style="margin-bottom:14px">Units</h3><ul class="list">' + units + '</ul></article>'
      + '<article class="card card--soft"><h3>How review works</h3>'
      + '<p style="font-size:14px;margin-top:6px">Every answer moves a word along: one day, then three, seven, '
      + 'sixteen and thirty-five. Miss it and it steps back two and returns in the same session.</p></article>'
      + '<button class="btn btn--quiet btn--full" id="reset">Reset ' + esc(c.name) + ' progress</button>';
  }

  return '<div class="page">'
    + '<div class="page-head"><div><div class="eyebrow">' + esc(c.name) + '</div><h1>Your progress</h1>'
    + '<p>What you have met, and what is coming back.</p></div></div>'
    + '<section class="hero"><div class="hero__txt"><span class="eyebrow">Spaced review</span>'
    + '<h2>' + (due ? due + (due > 1 ? " words are" : " word is") + " ready to come back"
                   : "Nothing is due right now") + '</h2>'
    + '<p>' + met.length + ' of ' + c.items.length + ' met in ' + esc(c.name) + '.</p>'
    + (due ? '<button class="btn btn--dark" id="practice">Review now '
             + ic("arrow_forward", "ms--sm") + '</button>' : "")
    + '</div><img src="assets/hero-progress.png" alt="Leon, the Linguae chameleon"></section>'
    + tabs + body + '</div>';
}

/* ---------- wiring for the shell pages ---------- */
function wireShell(){
  app.querySelectorAll("[data-page]").forEach(function(b){
    b.addEventListener("click", function(){
      page = b.getAttribute("data-page"); window.scrollTo(0, 0); render();
    });
  });
  app.querySelectorAll("[data-note]").forEach(function(b){
    b.addEventListener("click", function(){
      const id = b.getAttribute("data-note");
      openNotes[id] = !openNotes[id];
      render();
    });
  });
  app.querySelectorAll("[data-tab]").forEach(function(b){
    b.addEventListener("click", function(){ statTab = b.getAttribute("data-tab"); render(); });
  });
  const sw = document.getElementById("switch");
  if (sw) sw.addEventListener("click", function(){ S.active = null; save(); render(); });
  ["continue", "continue2"].forEach(function(id){
    const b = document.getElementById(id);
    if (b) b.addEventListener("click", function(){ startLesson(nextLesson()); });
  });
  const pr = document.getElementById("practice");
  if (pr) pr.addEventListener("click", function(){ startPractice("due"); });
  app.querySelectorAll("[data-practice]").forEach(function(b){
    b.addEventListener("click", function(){ startPractice(b.getAttribute("data-practice")); });
  });
  app.querySelectorAll("[data-lesson]").forEach(function(b){
    b.addEventListener("click", function(){
      const l = course().lessons.find(function(x){ return x.id === b.getAttribute("data-lesson"); });
      if (l) startLesson(l);
    });
  });
  const rs = document.getElementById("reset");
  if (rs) rs.addEventListener("click", function(){
    if (rs.dataset.armed) { S.courses[S.active] = freshCourse(); save(); render(); }
    else { rs.dataset.armed = "1"; rs.textContent = "Tap again to erase this course"; rs.classList.add("btn--coral"); }
  });
}

/* ---------- lesson ---------- */
function viewLesson(){
  const ex = currentEx();
  const pct = Math.round(sess.idx / sess.queue.length * 100);
  return '<div class="lsn"><div class="wrap lsn__top">'
    + '<button class="iconbtn" id="quit" aria-label="Leave lesson">' + ic("close") + '</button>'
    + progressBar(pct, "Lesson progress")
    + (sess.hearts === Infinity
        ? '<span class="lives lives--free">' + ic("all_inclusive") + '</span>'
        : '<span class="lives" aria-label="' + sess.hearts + ' lives left">' + ic("favorite") + sess.hearts + '</span>')
    + '</div>'
    + '<div class="lsn__body"><div class="wrap">' + bodyFor(ex, sess.state === "feedback") + '</div></div>'
    + '<div class="lsn__foot' + (sess.state === "feedback" ? (sess.lastOk ? " is-ok" : " is-no") : "")
    + '"><div class="wrap">' + footFor(ex) + '</div></div></div>';
}

function romOf(it){ return it.rom ? '<span class="rom">' + esc(it.rom) + '</span>' : ""; }
function spkBtn(item, cls){
  if (!item || !canHear(item, course().tts)) return "";
  return '<button class="speak ' + (cls || "") + '" data-item="' + esc(item.id)
    + '" aria-label="Play audio">' + ic("volume_up") + '</button>';
}
function qhead(tag, title){
  return '<div class="qtag">' + tag + '</div><h2 class="qlabel">' + title + '</h2>';
}

function bodyFor(ex, locked){
  const c = course();

  if (ex.kind === "match") {
    const left = ex.pairs.map(function(it){
      return '<button class="pair' + (sess.matched.indexOf(it.id) > -1 ? " gone" : "")
        + (sess.picked === "en:" + it.id ? " sel" : "") + '" data-side="en" data-id="' + it.id + '">'
        + esc(it.en) + '</button>';
    }).join("");
    /* No speaker buttons on this exercise: the word itself is the button, and
       a tap reads it out. A speaker of its own belongs to the exercises that
       ask about one word — there it marks which word is being asked about,
       where here it would be five of them in a column. */
    const right = shuffleStable(ex.pairs, ex.id).map(function(it){
      return '<button class="pair' + (sess.matched.indexOf(it.id) > -1 ? " gone" : "")
        + (sess.picked === "tgt:" + it.id ? " sel" : "") + '" data-side="tgt" data-id="' + it.id + '">'
        + esc(it.tgt) + romOf(it) + '</button>';
    }).join("");
    return qhead("Match the pairs", "Tap a word and its translation")
      + '<div class="pairs"><div class="col">' + left + '</div><div class="col">' + right + '</div></div>';
  }

  if (ex.kind === "pick_tgt") {
    return qhead("Choose the right answer", "How do you say this in " + esc(c.name) + "?")
      + '<div class="prompt">' + mascotImg("curious", 76) + '<div class="bubble">' + esc(ex.item.en) + '</div></div>'
      + optList(ex, locked, function(it){ return esc(it.tgt) + romOf(it); });
  }
  if (ex.kind === "pick_en") {
    return qhead("Choose the right answer", "What does this mean?")
      + '<div class="prompt">' + spkBtn(ex.item)
      + '<div class="bubble" style="font-size:21px">' + esc(ex.item.tgt) + romOf(ex.item) + '</div></div>'
      + optList(ex, locked, function(it){ return esc(it.en); });
  }
  if (ex.kind === "listen") {
    return qhead("Listening", "Listen, then choose the meaning")
      + spkBtn(ex.item, "speak--hero")
      + optList(ex, locked, function(it){ return esc(it.en); });
  }
  if (ex.kind === "bank") {
    const slot = sess.used.map(function(w, i){
      return '<button class="tile-w" data-un="' + i + '"' + (locked ? " disabled" : "") + '>' + esc(w) + '</button>';
    }).join("");
    const tiles = ex.tiles.map(function(w, i){
      const usedCount = sess.used.filter(function(u){ return u === w; }).length;
      const before = ex.tiles.slice(0, i).filter(function(x){ return x === w; }).length;
      const hide = before < usedCount;
      return '<button class="tile-w' + (hide ? " used" : "") + '" data-tile="' + i + '"'
        + (locked || hide ? " disabled" : "") + '>' + esc(w) + '</button>';
    }).join("");
    return qhead("Build the sentence", "Say this in " + esc(c.name))
      + '<div class="prompt">' + mascotImg("thinking", 76) + '<div class="bubble">' + esc(ex.item.en) + '</div></div>'
      + '<div class="slot">' + slot + '</div><div class="tiles">' + tiles + '</div>';
  }

  const note = ex.item.rom ? "The romanised reading is accepted too."
                           : (c.typeNote || "Accents are optional.");
  return qhead("Write it out", "Write this in " + esc(c.name))
    + '<div class="prompt">' + mascotImg("learning", 76) + '<div class="bubble">' + esc(ex.item.en) + '</div></div>'
    + '<textarea class="input" id="answer" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"'
    + (locked ? " disabled" : "") + '>' + esc(sess.given || "") + '</textarea>'
    + '<p class="hint">' + note + '</p>';
}

function optList(ex, locked, label){
  return '<div class="answers">' + ex.options.map(function(it, i){
    return '<button class="answer' + optCls(it.id, ex, locked) + '" data-pick="' + it.id + '"'
      + (locked ? " disabled" : "") + '><kbd>' + "ABCD".charAt(i) + '</kbd><span>'
      + label(it) + '</span></button>';
  }).join("") + '</div>';
}
/* Where the options are the words being learnt, the option is the button that
   plays it, the same as a pair in a match — no speaker of its own beside it.
   Where the options are in English there is nothing to hear on that side: the
   question keeps its own speaker, and a tap that played the prompt again would
   just be the word twice. */
function choose(id){
  const ex = currentEx();
  if (ex.kind === "pick_tgt") {
    const opt = ex.options.filter(function(o){ return o.id === id; })[0];
    if (opt) sayItem(opt, course().tts);
  }
  sess.sel = id;
  render();
}

function optCls(id, ex, locked){
  if (!locked) return sess.sel === id ? " selected" : "";
  if (id === ex.answer) return " correct";
  if (id === sess.sel) return " wrong";
  return "";
}
function shuffleStable(arr, seed){
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 9973;
  const r = arr.slice();
  for (let i = r.length - 1; i > 0; i--) {
    h = (h * 17 + 11) % 9973;
    const j = h % (i + 1);
    const t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}

const PRAISE = ["Excellent! That's correct.", "That's right.", "Exactly right.", "Well done.", "Correct."];
function pickPraise(){ return PRAISE[sess.answered % PRAISE.length]; }

function footFor(ex){
  if (sess.state === "feedback") {
    const ok = sess.lastOk;
    const answer = ex.item ? ex.item.tgt + (ex.item.rom ? " (" + ex.item.rom + ")" : "") : "";
    const title = ok ? (sess.typo ? "Correct — mind the spelling" : pickPraise())
                     : "Almost there. Let's try again.";
    return '<div class="footrow" role="status">'
      + '<span class="fbicon">' + ic(ok ? "check_circle" : "cancel") + '</span>'
      + '<span class="fbtext"><b>' + title + '</b>'
      + (ok && !sess.typo ? "" : '<small>' + esc(answer)
          + (ex.item ? spkBtn(ex.item, "speak--sm") : "") + '</small>') + '</span>'
      + '<img class="foot-leon" src="' + MASCOT[ok ? "celebrating" : "thinking"]
      + '" alt="Leon, the Linguae chameleon">'
      + '<button class="btn btn--primary" id="cont">Continue</button></div>';
  }
  if (ex.kind === "match") {
    return '<div class="footrow"><span class="kbdhint">Tap a word, then its translation</span>'
      + '<button class="btn" disabled>Match all five pairs</button></div>';
  }
  const ready = ex.kind === "bank" ? sess.used.length > 0
              : (ex.kind === "write" ? true : sess.sel !== null);
  return '<div class="footrow">'
    + '<button class="skip" id="skip">Skip</button>'
    + '<span class="kbdhint">Press Enter to check</span>'
    + '<button class="btn btn--primary" id="check"' + (ready ? "" : " disabled")
    + '>Check answer</button></div>';
}

/* Skipping gives up on the question: the answer is revealed, the word goes
   into the schedule, and it costs a heart like any other miss. */
function skipQuestion(){
  sess.sel = null;
  sess.used = [];
  sess.given = "";
  const ta = document.getElementById("answer");
  if (ta) ta.value = "";
  submit();
}

function wireLesson(){
  const q = document.getElementById("quit");
  if (q) q.addEventListener("click", quitLesson);
  app.querySelectorAll("[data-item]").forEach(function(b){
    b.addEventListener("click", function(){
      sayItem(course().byId[b.getAttribute("data-item")], course().tts);
    });
  });
  const ex = currentEx();
  if (ex.kind === "listen" && sess.state === "ask" && !sess.spoke) {
    sess.spoke = true;
    sayItem(ex.item, course().tts);
  }
  app.querySelectorAll("[data-pick]").forEach(function(b){
    b.addEventListener("click", function(){ choose(b.getAttribute("data-pick")); });
  });
  app.querySelectorAll("[data-tile]").forEach(function(b){
    b.addEventListener("click", function(){
      const word = ex.tiles[+b.getAttribute("data-tile")];
      sess.used.push(word);
      speak(word, course().tts);
      render();
    });
  });
  app.querySelectorAll("[data-un]").forEach(function(b){
    b.addEventListener("click", function(){ sess.used.splice(+b.getAttribute("data-un"), 1); render(); });
  });
  app.querySelectorAll("[data-side]").forEach(function(b){
    b.addEventListener("click", function(){ tapPair(b, ex); });
  });
  const chk = document.getElementById("check");
  const ta = document.getElementById("answer");
  if (ta) {
    ta.focus();
    if (chk) chk.disabled = !ta.value.trim();
    ta.addEventListener("input", function(){ if (chk) chk.disabled = !ta.value.trim(); });
    ta.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); if (ta.value.trim()) submit(); }
    });
  }
  if (chk) chk.addEventListener("click", submit);
  const sk = document.getElementById("skip");
  if (sk) sk.addEventListener("click", skipQuestion);
  const cont = document.getElementById("cont");
  if (cont) { cont.addEventListener("click", advance); cont.focus(); }
}

function tapPair(btn, ex){
  const side = btn.getAttribute("data-side"), id = btn.getAttribute("data-id");
  const token = side + ":" + id;
  if (sess.matched.indexOf(id) > -1) return;
  /* A tap on the word being learnt reads it out, whether it opens a link or
     closes one. The English side stays quiet: reading the French out there
     would be the same word a second time, which is what it used to do. */
  if (side === "tgt") sayItem(course().byId[id], course().tts);
  if (!sess.picked) { sess.picked = token; render(); return; }
  const parts = sess.picked.split(":"), pSide = parts[0], pId = parts[1];
  if (pSide === side) { sess.picked = token; render(); return; }
  if (pId === id) {
    sess.matched.push(id);
    sess.picked = null;
    gradeItem(id, true);
    save();
    if (sess.matched.length === ex.pairs.length) {
      sess.correct++; sess.answered++;
      sess.state = "feedback"; sess.lastOk = true;
      sayRight();
    }
    render();
  } else {
    const other = app.querySelector('[data-side="' + pSide + '"][data-id="' + pId + '"]');
    sayWrong();
    btn.classList.add("bad");
    if (other) other.classList.add("bad");
    gradeItem(id, false);
    gradeItem(pId, false);
    /* A pair that does not match is a wrong answer like any other, and costs
       the same heart. Both words go back a box, but the tap was one mistake,
       not two, so the lesson is charged once. */
    sess.mistakes++;
    if (sess.hearts !== Infinity) sess.hearts--;
    sess.picked = null;
    save();
    if (sess.hearts <= 0) { sess.state = "dead"; render(); return; }
    setTimeout(render, 320);
  }
}

/* ---------- out of lives ---------- */
function viewDead(){
  return '<div class="wrap sheet">' + mascotImg("thinking", 190)
    + '<h1>Let\'s take this one again</h1>'
    /* A lesson can now end inside the opening match, where nothing has been
       finished yet and a score would read "0 of 0". */
    + (sess.answered
        ? '<p>You answered ' + sess.correct + ' of ' + sess.answered
          + ' correctly, and the words you missed are already queued for review.</p>'
        : '<p>The hearts ran out before a question was through. The words you '
          + 'missed are already queued for review.</p>')
    + '<button class="btn btn--primary btn--full" id="again">Retry the lesson</button>'
    + '<button class="btn btn--outline btn--full" id="leave">Back to the path</button></div>';
}
function wireDead(){
  document.getElementById("again").addEventListener("click", function(){
    const l = sess.lesson; quitLesson();
    if (l && l.id !== "practice") startLesson(l); else startPractice();
  });
  document.getElementById("leave").addEventListener("click", quitLesson);
}

/* ---------- lesson complete ---------- */
function viewDone(){
  const acc = sess.answered ? Math.round(sess.correct / sess.answered * 100) : 100;
  const cr = sess.mode === "lesson" ? crownsOf(sess.lesson.id) : 0;
  const fresh = sess.fresh || (sess.fresh = grantAchievements(sess));
  const toasts = fresh.map(function(a){
    return '<div class="toast"><div class="medal">' + ic(a.icon) + '</div>'
      + '<div><b>New achievement unlocked!</b><small>' + esc(a.name) + ' — ' + esc(a.desc) + '</small></div></div>';
  }).join("");
  return '<div class="wrap sheet">' + mascotImg("celebrating", 190)
    + '<div><h1>Lesson complete. Good work!</h1>'
    + '<p style="margin-top:6px">' + esc(sess.lesson.title)
    + (sess.mode === "lesson" ? " · crown " + cr + " of 5" : " · practice") + '</p></div>'
    + '<div class="chips">'
    + '<span class="chipstat" style="color:var(--color-primary-ink)">' + ic("bolt", "ms--sm") + '+' + sess.gained + ' XP</span>'
    + '<span class="chipstat">' + ic("percent", "ms--sm") + acc + '%</span>'
    + '<span class="chipstat" style="color:var(--color-accent-ink)">' + ic("local_fire_department", "ms--sm") + S.streak + '</span>'
    + '</div>' + toasts
    + (sess.mode === "lesson" && cr < 5 ? '<button class="btn btn--primary btn--full" id="again">Practise it again</button>' : "")
    + '<button class="btn ' + (sess.mode === "lesson" && cr < 5 ? "btn--outline" : "btn--primary")
    + ' btn--full" id="leave">Back to the path</button></div>';
}
function wireDone(){
  const a = document.getElementById("again");
  if (a) a.addEventListener("click", function(){ const l = sess.lesson; quitLesson(); startLesson(l); });
  document.getElementById("leave").addEventListener("click", quitLesson);
}

/* ============================== KEYBOARD ==============================

   Only the letters printed on the options pick one. A digit used to work as
   well, which is a key the screen never offers and which answers a question
   that was never asked in numbers. */
function optionIndexFor(key){
  return /^[a-dA-D]$/.test(key) ? key.toLowerCase().charCodeAt(0) - 97 : -1;
}


document.addEventListener("keydown", function(e){
  if (!sess) return;
  if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
    const c = document.getElementById("cont") || document.getElementById("check");
    if (c && !c.disabled) { e.preventDefault(); c.click(); }
    return;
  }
  if (sess.state !== "ask") return;
  const i = optionIndexFor(e.key);
  if (i >= 0) {
    const b = app.querySelectorAll("[data-pick]")[i];
    if (b) { e.preventDefault(); b.click(); }
  }
});

/* voices arrive asynchronously; re-render once so audio exercises can appear */
if (canSpeak) {
  let once = false;
  const onVoices = function(){
    if (once) return;
    once = true;
    refreshVoices();
    if (!sess && S.active) render();
  };
  try { window.speechSynthesis.addEventListener("voiceschanged", onVoices); } catch (e) {}
  setTimeout(onVoices, 1200);
}

loadClips();
render();
</script>
